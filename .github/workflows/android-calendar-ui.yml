name: Android calendar UI regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-calendar-ui.yml'
  push:
    branches: [main, 'fix/calendar-*']
    paths:
      - 'android-app/**'
      - '.github/workflows/android-calendar-ui.yml'

permissions:
  contents: read

jobs:
  calendar-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Compose UI tests on API 34
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          working-directory: android-app
          script: gradle --no-daemon --max-workers=1 connectedDebugAndroidTest
      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-ui-reports
          path: |
            android-app/app/build/reports/androidTests/
            android-app/app/build/outputs/androidTest-results/
          retention-days: 7
