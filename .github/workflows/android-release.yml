name: Build Signed Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/android-release.yml"

permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_B64 is missing"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is missing"; exit 1; }

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > release.keystore
          chmod 600 release.keystore

      - name: Run unit tests
        run: gradle --no-daemon --max-workers=1 testDebugUnitTest

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ../release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --max-workers=1 assembleRelease

      - name: Verify release APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: SCERP-Android-signed-release
          path: android-app/app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release and update metadata
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="$(grep -oP 'versionName "\K[^"]+' app/build.gradle)"
          VERSION_CODE="$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle)"
          TAG="android-v$VERSION_NAME"
          APK="app/build/outputs/apk/release/app-release.apk"
          RELEASE_APK="MilseongJeil-v$VERSION_NAME.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; recovering metadata from the published asset."
            mkdir -p existing-release
            gh release download "$TAG" --pattern "$RELEASE_APK" --dir existing-release
            test -f "existing-release/$RELEASE_APK"
            SHA256="$(sha256sum "existing-release/$RELEASE_APK" | awk '{print $1}')"
          else
            cp "$APK" "$RELEASE_APK"
            SHA256="$(sha256sum "$RELEASE_APK" | awk '{print $1}')"

            gh release create "$TAG" "$RELEASE_APK" \
              --target "$GITHUB_SHA" \
              --title "MilseongJeil-Android-v$VERSION_NAME" \
              --notes "v$VERSION_NAME: 오늘 화면의 날짜를 누르면 달력에서 원하는 날짜를 직접 선택할 수 있습니다. 좁은 화면과 큰 글꼴에서도 날짜가 한 줄로 보이도록 표시를 최적화했습니다."
          fi

          cat > ../android-latest.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://github.com/KANG77556/simple-timetable-updates/releases/download/$TAG/$RELEASE_APK",
            "sha256": "$SHA256",
            "notes": "v$VERSION_NAME: 오늘 화면의 날짜를 누르면 달력에서 원하는 날짜를 직접 선택할 수 있습니다. 좁은 화면과 큰 글꼴에서도 날짜가 한 줄로 보이도록 표시를 최적화했습니다."
          }
          EOF

          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-latest.json
          if git diff --cached --quiet; then
            echo "android-latest.json is already current."
          else
            git commit -m "release: publish Android v$VERSION_NAME update metadata"
            published=false
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                published=true
                break
              fi
              sleep 2
            done
            test "$published" = true
          fi
