name: Android PR Verification

on:
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android-pr-verify.yml"

permissions:
  contents: read

jobs:
  android-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Run regression unit tests
        run: gradle --no-daemon --max-workers=1 testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon --max-workers=1 assembleDebug
      - name: Inspect APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5
          sha256sum "$APK"
