name: Build Installable Preview APK

on:
  push:
    branches:
      - test/installable-preview-20260929
    paths:
      - 'android-app/**'
      - '.github/workflows/preview-install-test.yml'
  workflow_dispatch:

jobs:
  build-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build preview APK
        run: gradle --no-daemon --max-workers=1 assembleDebug

      - name: Verify preview APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8
          sha256sum "$APK"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android-app/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path kr.hs.msji.milseongjeil.stable.preview
            adb shell monkey -p kr.hs.msji.milseongjeil.stable.preview -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell pidof kr.hs.msji.milseongjeil.stable.preview
            adb shell dumpsys package kr.hs.msji.milseongjeil.stable.preview | grep -E 'versionName|versionCode' | head -n 4

      - uses: actions/upload-artifact@v4
        with:
          name: Milseong-Preview-installable
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
